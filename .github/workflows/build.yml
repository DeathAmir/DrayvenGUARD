name: Build DrayvenGUARD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-plugin:
    name: Build server plugin ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: drayvenguard-linux-x64
          - os: windows-latest
            artifact: drayvenguard-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDG_BUILD_SERVER_PLUGIN=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Stage release
        shell: bash
        run: |
          mkdir -p release
          cp build/bin/drayvenguard.* release/
          cp include/drayvenguard.inc release/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
  build-asi:
    name: Build 32-bit client ASI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x86
        run: cmake -S . -B build-asi -A Win32 -DDG_BUILD_SERVER_PLUGIN=OFF -DDG_BUILD_CLIENT_ASI=ON
      - name: Build ASI
        run: cmake --build build-asi --config Release --target iRxVoice2Helper --parallel 2
      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: iRxVoice2Helper-windows-x86
          path: build-asi/Release/iRxVoice2Helper.asi
          if-no-files-found: error
          retention-days: 30
  build-omp-component:
    name: Build open.mp native component (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            cmake_arch: Win32
            artifact: drayvenguard-openmp-windows-x86
            output: build-omp/Release/drayvenguard-omp.dll
          - arch: x64
            cmake_arch: x64
            artifact: drayvenguard-openmp-windows-x64
            output: build-omp/Release/drayvenguard-omp.dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-omp -A ${{ matrix.cmake_arch }} -DDG_BUILD_SERVER_PLUGIN=OFF -DDG_BUILD_OMP_COMPONENT=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build component
        run: cmake --build build-omp --config Release --target drayvenguard_omp_component --parallel 2
      - name: Upload component
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30
